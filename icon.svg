<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Open Book Base -->
  <g transform="translate(96, 120)" filter="url(#glow)">
    <!-- Left Page -->
    <path d="M160 220 C110 200, 40 200, 0 215 L0 45 C40 30, 110 30, 160 50 Z" fill="#f8fafc" opacity="0.95" />
    <!-- Right Page -->
    <path d="M160 220 C210 200, 280 200, 320 215 L320 45 C280 30, 210 30, 160 50 Z" fill="#e2e8f0" opacity="0.9" />
    <!-- Book Spine & Binding -->
    <path d="M160 45 L160 225" stroke="#047857" stroke-width="8" stroke-linecap="round" />
    <!-- Text Lines on Left Page -->
    <line x1="30" y1="80" x2="130" y2="80" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="30" y1="110" x2="120" y2="110" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="30" y1="140" x2="135" y2="140" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="30" y1="170" x2="90" y2="170" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

    <!-- Text Lines on Right Page -->
    <line x1="190" y1="80" x2="290" y2="80" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="190" y1="110" x2="280" y2="110" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="190" y1="140" x2="295" y2="140" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="190" y1="170" x2="240" y2="170" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Golden Quill / Feather Pen -->
  <g transform="translate(260, 90) rotate(15)">
    <path d="M70 10 C60 50, 40 100, 0 160 C25 140, 40 115, 55 90 C70 65, 80 35, 70 10 Z" fill="url(#goldGrad)" />
    <path d="M0 160 L-10 185 L5 170 Z" fill="#fbbf24" />
    <circle cx="-10" cy="188" r="3" fill="#10b981" />
  </g>

  <!-- "ENGLISH MASTER" Badge Bottom -->
  <rect x="106" y="380" width="300" height="54" rx="27" fill="#047857" opacity="0.9" />
  <text x="256" y="415" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">ENGLISH MASTER</text>
</svg>
